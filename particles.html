<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HP INTEL SYSTEM · Particle Drift</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { height: 100%; }
    body {
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 38%, rgba(0,180,255,0.10), transparent 62%),
        radial-gradient(ellipse at 85% 90%, rgba(168,85,247,0.08), transparent 55%),
        #05080f;
      font-family: 'Segoe UI', system-ui, sans-serif;
      user-select: none;
    }

    /* ---------- futuristic blueprint grid ---------- */
    .grid-bg {
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,229,255,0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.055) 1px, transparent 1px),
        linear-gradient(rgba(0,229,255,0.13) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.13) 1px, transparent 1px);
      background-size: 36px 36px, 36px 36px, 180px 180px, 180px 180px;
      -webkit-mask-image: radial-gradient(ellipse at 50% 45%, black 30%, rgba(0,0,0,0.3) 85%);
      mask-image: radial-gradient(ellipse at 50% 45%, black 30%, rgba(0,0,0,0.3) 85%);
      animation: grid-pulse 6s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes grid-pulse {
      0%, 100% { opacity: 0.95; }
      50%      { opacity: 0.6; }
    }

    .particle-canvas {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      display: block;
      cursor: crosshair;
    }

    .topbar {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 28px; z-index: 10;
      pointer-events: none;
    }
    .brand {
      font-weight: 800; letter-spacing: 4px; font-size: 14px;
      color: #e8f4ff;
      pointer-events: auto;
    }
    .brand span {
      background: linear-gradient(90deg, #00f5ff, #a855f7);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      text-shadow: none;
    }
    .back-link {
      pointer-events: auto;
      color: rgba(232,244,255,0.65); text-decoration: none;
      font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
      padding: 8px 14px; border: 1px solid rgba(0,229,255,0.25);
      border-radius: 999px; background: rgba(10,14,23,0.5);
      backdrop-filter: blur(6px);
      transition: all .3s;
    }
    .back-link:hover {
      color: #00f5ff; border-color: rgba(0,245,255,0.55);
      box-shadow: 0 0 16px rgba(0,245,255,0.25);
    }
    .hint {
      position: fixed; bottom: 26px; left: 50%;
      transform: translateX(-50%);
      z-index: 10; pointer-events: none;
      font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
      color: rgba(0,245,255,0.6);
      text-shadow: 0 0 10px rgba(0,245,255,0.35);
      animation: hint-pulse 2.4s ease-in-out infinite;
      text-align: center; white-space: nowrap;
    }
    @keyframes hint-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .counter {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      z-index: 10; pointer-events: none;
      font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase;
      color: rgba(232,244,255,0.35);
    }
    .counter b { color: #fde047; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React 18 (UMD) + Babel standalone, pinned with SRI -->
  <script crossorigin="anonymous" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin="anonymous" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script crossorigin="anonymous" integrity="sha384-x/ilTFv/u/eu6YSmkFDZl5V5Mm/pkxxcVv2cVJOrr1J0rvILhMvRBCy6yA75wYBj" src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <script type="text/babel" data-presets="env,react">
    const { useRef, useEffect } = React;

    /* vibrant palette: cyan, purple, yellow */
    const PALETTE = [
      '#00f5ff', '#22d3ee', '#67e8f9', '#06b6d4',   // cyan
      '#a855f7', '#c084fc', '#8b5cf6', '#d946ef',   // purple
      '#fde047', '#facc15', '#fbbf24', '#f59e0b'    // yellow
    ];
    const COUNT = 420;

    function ParticleField() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const DPR = Math.min(window.devicePixelRatio || 1, 2);
        let W = 0, H = 0, raf = 0;

        const mouse = { x: -9999, y: -9999, active: false, idleTimer: null };

        const resize = () => {
          W = window.innerWidth; H = window.innerHeight;
          canvas.width = W * DPR; canvas.height = H * DPR;
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        };
        resize();

        /* ---- spawn particles: each has its own spring stiffness (lag) ---- */
        const particles = Array.from({ length: COUNT }, () => ({
          x: Math.random() * W,
          y: Math.random() * H,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3,
          r: 1.1 + Math.random() * 2.3,
          color: PALETTE[(Math.random() * PALETTE.length) | 0],
          k: 0.0012 + Math.random() * 0.0033,   // spring stiffness -> varied lag
          damp: 0.92 + Math.random() * 0.045,   // damping -> smooth follow
          swirl: 0.25 + Math.random() * 0.75,
          phase: Math.random() * Math.PI * 2    // drift wobble phase
        }));

        /* ---- pointer tracking ---- */
        const wake = (x, y) => {
          mouse.x = x; mouse.y = y; mouse.active = true;
          clearTimeout(mouse.idleTimer);
          mouse.idleTimer = setTimeout(() => { mouse.active = false; }, 2600);
        };
        const onMove  = e => wake(e.clientX, e.clientY);
        const onTouch = e => { const t = e.touches[0]; if (t) wake(t.clientX, t.clientY); };
        const onLeave = () => { mouse.active = false; };
        window.addEventListener('mousemove', onMove, { passive: true });
        window.addEventListener('touchmove', onTouch, { passive: true });
        document.addEventListener('mouseleave', onLeave);

        /* ---- physics + render loop ---- */
        let t = 0;
        const tick = () => {
          t += 0.008;

          /* fade previous frame toward transparency -> soft trails over the grid */
          ctx.globalCompositeOperation = 'destination-out';
          ctx.fillStyle = 'rgba(0,0,0,0.16)';
          ctx.fillRect(0, 0, W, H);
          ctx.globalCompositeOperation = 'source-over';

          for (const p of particles) {
            if (mouse.active) {
              /* lagging spring toward the cursor */
              const dx = mouse.x - p.x;
              const dy = mouse.y - p.y;
              const d  = Math.hypot(dx, dy) || 1;
              p.vx += dx * p.k;
              p.vy += dy * p.k;
              /* subtle orbit swirl around the cursor */
              p.vx += (-dy / d) * 0.035 * p.swirl;
              p.vy += ( dx / d) * 0.035 * p.swirl;
              p.vx *= p.damp;
              p.vy *= p.damp;
            } else {
              /* zero-gravity drift with slow wobble */
              p.vx += Math.cos(t * 2 + p.phase) * 0.004;
              p.vy += Math.sin(t * 1.6 + p.phase * 1.3) * 0.004;
              p.vx *= 0.995; p.vy *= 0.995;
              const sp = Math.hypot(p.vx, p.vy);
              if (sp > 0.45) { p.vx *= 0.45 / sp; p.vy *= 0.45 / sp; }
            }

            p.x += p.vx;
            p.y += p.vy;

            /* wrap around edges */
            const m = 14;
            if (p.x < -m) p.x = W + m; else if (p.x > W + m) p.x = -m;
            if (p.y < -m) p.y = H + m; else if (p.y > H + m) p.y = -m;

            /* glow halo + dot */
            ctx.globalAlpha = 0.18;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r * 2.6, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 0.95;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
          raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);

        window.addEventListener('resize', resize);
        return () => {
          cancelAnimationFrame(raf);
          clearTimeout(mouse.idleTimer);
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('touchmove', onTouch);
          window.removeEventListener('resize', resize);
          document.removeEventListener('mouseleave', onLeave);
        };
      }, []);

      return <canvas ref={canvasRef} className="particle-canvas" />;
    }

    function App() {
      return (
        <React.Fragment>
          <div className="grid-bg" />
          <ParticleField />
          <div className="topbar">
            <div className="brand">HP INTEL <span>SYSTEM</span></div>
            <a className="back-link" href="index.html">&larr; Back to site</a>
          </div>
          <div className="counter"><b>{COUNT}</b> particles &middot; zero-gravity drift field</div>
          <div className="hint">Move your mouse &mdash; the particles will follow</div>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
