<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HP INTEL SYSTEM · Particle Drift</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { height: 100%; }
    body {
      overflow: hidden;
      background: #faf7f2;
      font-family: 'Segoe UI', system-ui, sans-serif;
      user-select: none;
    }
    .particle-canvas {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      display: block;
      cursor: crosshair;
    }
    .topbar {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 28px; z-index: 10;
      pointer-events: none;
    }
    .brand {
      font-weight: 800; letter-spacing: 4px; font-size: 14px;
      color: #2b2440;
      pointer-events: auto;
    }
    .brand span {
      background: linear-gradient(90deg, #ec4899, #a855f7);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .back-link {
      pointer-events: auto;
      color: #6d6486; text-decoration: none;
      font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
      padding: 8px 14px; border: 1px solid rgba(120,100,160,0.25);
      border-radius: 999px; background: rgba(255,255,255,0.55);
      backdrop-filter: blur(6px);
      transition: all .3s;
    }
    .back-link:hover {
      color: #a855f7; border-color: rgba(168,85,247,0.5);
      box-shadow: 0 0 16px rgba(168,85,247,0.18);
    }
    .hint {
      position: fixed; bottom: 26px; left: 50%;
      transform: translateX(-50%);
      z-index: 10; pointer-events: none;
      font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
      color: rgba(90,70,120,0.55);
      animation: hint-pulse 2.4s ease-in-out infinite;
      text-align: center; white-space: nowrap;
    }
    @keyframes hint-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    .counter {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      z-index: 10; pointer-events: none;
      font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase;
      color: rgba(90,70,120,0.4);
    }
    .counter b { color: #ec4899; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React 18 (UMD) + Babel standalone, pinned with SRI -->
  <script crossorigin="anonymous" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin="anonymous" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script crossorigin="anonymous" integrity="sha384-x/ilTFv/u/eu6YSmkFDZl5V5Mm/pkxxcVv2cVJOrr1J0rvILhMvRBCy6yA75wYBj" src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <script type="text/babel" data-presets="env,react">
    const { useRef, useEffect, useState } = React;

    /* pastel palette: pinks, purples, yellows */
    const PALETTE = [
      '#ff6b9d', '#ff8fab', '#f472b6', '#fb7185',   // pinks
      '#a78bfa', '#8b5cf6', '#c084fc', '#7c3aed',   // purples
      '#fbbf24', '#facc15', '#fde047', '#f59e0b'    // yellows
    ];
    const BG = { r: 250, g: 247, b: 242 };           // clean minimalist canvas
    const COUNT = 420;

    function ParticleField() {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const DPR = Math.min(window.devicePixelRatio || 1, 2);
        let W = 0, H = 0, raf = 0;

        const mouse = { x: -9999, y: -9999, active: false, idleTimer: null };

        const resize = () => {
          W = window.innerWidth; H = window.innerHeight;
          canvas.width = W * DPR; canvas.height = H * DPR;
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
          ctx.fillStyle = `rgb(${BG.r},${BG.g},${BG.b})`;
          ctx.fillRect(0, 0, W, H);
        };
        resize();

        /* ---- spawn particles ---- */
        const particles = Array.from({ length: COUNT }, () => ({
          x: Math.random() * W,
          y: Math.random() * H,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3,
          r: 1.1 + Math.random() * 2.4,
          color: PALETTE[(Math.random() * PALETTE.length) | 0],
          pull: 0.5 + Math.random(),          // individual attraction strength
          phase: Math.random() * Math.PI * 2  // drift wobble phase
        }));

        /* ---- pointer tracking ---- */
        const wake = (x, y) => {
          mouse.x = x; mouse.y = y; mouse.active = true;
          clearTimeout(mouse.idleTimer);
          mouse.idleTimer = setTimeout(() => { mouse.active = false; }, 2600);
        };
        const onMove  = e => wake(e.clientX, e.clientY);
        const onTouch = e => { const t = e.touches[0]; if (t) wake(t.clientX, t.clientY); };
        const onLeave = () => { mouse.active = false; };
        window.addEventListener('mousemove', onMove, { passive: true });
        window.addEventListener('touchmove', onTouch, { passive: true });
        document.addEventListener('mouseleave', onLeave);

        /* ---- physics + render loop ---- */
        let t = 0;
        const tick = () => {
          t += 0.008;

          /* soft trail: translucent wash of the background color */
          ctx.fillStyle = `rgba(${BG.r},${BG.g},${BG.b},0.16)`;
          ctx.fillRect(0, 0, W, H);

          for (const p of particles) {
            if (mouse.active) {
              /* spring toward the pointer */
              const dx = mouse.x - p.x;
              const dy = mouse.y - p.y;
              const d  = Math.hypot(dx, dy) || 1;
              const f  = Math.min(0.09, (0.55 * p.pull) / d);
              p.vx += dx * f * 0.22;
              p.vy += dy * f * 0.22;
              /* gentle swirl around the cursor */
              p.vx += -dy / d * 0.05 * p.pull;
              p.vy +=  dx / d * 0.05 * p.pull;
              p.vx *= 0.93; p.vy *= 0.93;   // damping = smooth follow
            } else {
              /* zero-gravity drift with slow wobble */
              p.vx += Math.cos(t * 2 + p.phase) * 0.004;
              p.vy += Math.sin(t * 1.6 + p.phase * 1.3) * 0.004;
              p.vx *= 0.995; p.vy *= 0.995;
              /* keep drift lazy */
              const sp = Math.hypot(p.vx, p.vy);
              if (sp > 0.45) { p.vx *= 0.45 / sp; p.vy *= 0.45 / sp; }
            }

            p.x += p.vx;
            p.y += p.vy;

            /* wrap around edges */
            const m = 14;
            if (p.x < -m) p.x = W + m; else if (p.x > W + m) p.x = -m;
            if (p.y < -m) p.y = H + m; else if (p.y > H + m) p.y = -m;

            /* halo + dot */
            ctx.globalAlpha = 0.16;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r * 2.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 0.92;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
          raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);

        window.addEventListener('resize', resize);
        return () => {
          cancelAnimationFrame(raf);
          clearTimeout(mouse.idleTimer);
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('touchmove', onTouch);
          window.removeEventListener('resize', resize);
          document.removeEventListener('mouseleave', onLeave);
        };
      }, []);

      return <canvas ref={canvasRef} className="particle-canvas" />;
    }

    function App() {
      return (
        <React.Fragment>
          <ParticleField />
          <div className="topbar">
            <div className="brand">HP INTEL <span>SYSTEM</span></div>
            <a className="back-link" href="index.html">&larr; Back to site</a>
          </div>
          <div className="counter"><b>{COUNT}</b> particles &middot; zero-gravity drift field</div>
          <div className="hint">Move your mouse &mdash; the particles will follow</div>
        </React.Fragment>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
